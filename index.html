<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade 9 AI Learning Hub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 50px 20px;
      font-family: "Times New Roman", serif;
      text-align: center;
      background: #f0f5ff;
      color: #17324d;
    }

    main {
      max-width: 700px;
      margin: auto;
    }

    h1 { font-size: 32px; }

    p {
      font-size: 20px;
      line-height: 1.5;
    }

    nav {
      display: grid;
      gap: 18px;
      margin-top: 30px;
    }

    a {
      display: block;
      padding: 24px;
      background: #174a80;
      color: white;
      font-size: 24px;
      text-decoration: none;
      border-radius: 14px;
    }

    a:hover { background: #10365e; }

    a:focus-visible {
      outline: 4px solid #b45309;
      outline-offset: 4px;
    }

    footer {
      margin-top: 40px;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

  <main>
    <h1>Grade 9 AI Learning Hub</h1>
    <p>
